# .github/workflows/tracker.yml

name: NHS Job Tracker

# This controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs the job on a schedule (uses UTC time)
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'  # 1,440 runs/month

jobs:
  tracker-nhs:
    name: Northampton General Hospital Tracker
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CI: true
      
    permissions:
      contents: write

    steps:
      # Step 1: Check out your repository's code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install your project's dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Add execute permission to Playwright
      - name: Add execute permission to Playwright
        run: chmod +x node_modules/.bin/playwright

      # Step 5: Install Playwright browsers with system dependencies
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Step 6: Run the NHS tracker script
      - name: Run NHS tracker
        run: node tracker.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI: 'true'

      # Step 7: Commit the updated NHS jobs.json file back to the repository
      - name: Commit NHS data file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🏥 Update NHS job data'
          file_pattern: 'data/jobs.json'

      # Step 8: Upload NHS screenshots as an artifact if the job fails
      - name: Upload NHS screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nhs-debug-screenshots
          path: screenshots/nhs/
          retention-days: 7