# .github/workflows/tracker.yml

name: Northampton Job Tracker

on:
  # Allows manual run from the Actions tab
  workflow_dispatch:

  # Runs every 30 minutes (UTC)
  schedule:
    - cron: '*/30 * * * *'  # 1,440 runs/month

jobs:
  tracker-northampton:
    name: Northampton General Hospital Tracker
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CI: true

    permissions:
      contents: write

    steps:
      # Step 1: Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Add execute permission to Playwright
      - name: Add execute permission to Playwright
        run: chmod +x node_modules/.bin/playwright

      # Step 5: Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Step 6: Run Northampton tracker
      - name: Run Northampton tracker
        run: node tracker.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI: 'true'

      # Step 7: Commit updated job data
      - name: Commit Northampton job data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🏥 Update Northampton job data'
          file_pattern: 'data/jobs.json'

      # Step 8: Upload screenshots if the job fails
      - name: Upload Northampton screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: northampton-debug-screenshots
          path: screenshots/
          retention-days: 7
